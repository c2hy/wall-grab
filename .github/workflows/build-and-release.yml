# .github/workflows/build.yml
name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

# 添加必要的权限
permissions:
  contents: write
  packages: write

jobs:
  build-windows-installer:
    name: Build WallGap Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set APP_VERSION from tag
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "Set APP_VERSION to: $version"
        shell: pwsh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $GITHUB_PATH

      - name: Debug environment variables
        run: |
          echo "GITHUB_REF: $env:GITHUB_REF"
          echo "APP_VERSION: $env:APP_VERSION"
        shell: pwsh

      - name: Create installer
        run: iscc installer.iss

      - name: Sign installer with self-signed certificate (for testing)
        run: |
          # 创建自签名证书用于测试
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WallGap Open Source" -CertStoreLocation "Cert:\CurrentUser\My" -KeyUsage DigitalSignature
          
          # 导出证书
          $password = ConvertTo-SecureString -String "temp123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "temp_cert.pfx" -Password $password
          
          # 签名安装程序
          $installer = Get-ChildItem "installer_output\WallGap-Setup-*.exe" | Select-Object -First 1
          signtool sign /f temp_cert.pfx /p temp123 /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$($installer.FullName)"
          
          # 验证签名
          signtool verify /pa "$($installer.FullName)"
        shell: pwsh

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/WallGap-Setup-*.exe
          tag_name: ${{ github.ref_name }}
          name: WallGap ${{ env.APP_VERSION }}
          body: |
            ## WallGap ${{ env.APP_VERSION }}
            
            ### 安装说明
            1. 下载并运行 `WallGap-Setup-${{ env.APP_VERSION }}.exe`
            2. 按照安装向导完成安装
            3. 安装完成后即可使用 WallGap
            
            ### 更新内容
            - 版本 ${{ env.APP_VERSION }} 发布
            - 包含最新的功能改进和错误修复
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
