# .github/workflows/build.yml
name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

# 添加必要的权限
permissions:
  contents: write
  packages: write

jobs:
  build-windows-installer:
    name: Build WallGrap Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set APP_VERSION from tag
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "Set APP_VERSION to: $version"
        shell: pwsh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $GITHUB_PATH

      - name: Debug environment variables
        run: |
          echo "GITHUB_REF: $env:GITHUB_REF"
          echo "APP_VERSION: $env:APP_VERSION"
        shell: pwsh

      - name: Create installer
        run: iscc installer.iss

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/WallGrap-Setup-*.exe
          tag_name: ${{ github.ref_name }}
          name: WallGrap ${{ env.APP_VERSION }}
          body: |
            ## WallGrap ${{ env.APP_VERSION }}
            
            ### Installation Instructions
            1. Download and run `WallGrap-Setup-${{ env.APP_VERSION }}.exe`
            2. When Windows shows security warning, click "More info" then "Run anyway"
            3. Follow the installation wizard to complete setup
            4. Launch WallGrap after installation
            
            ### 安装说明
            1. 下载并运行 `WallGrap-Setup-${{ env.APP_VERSION }}.exe`
            2. 当 Windows 显示安全警告时，点击"更多信息"然后"仍要运行"
            3. 按照安装向导完成安装
            4. 安装完成后即可使用 WallGrap
            
            ### What's New
            - Version ${{ env.APP_VERSION }} release
            - Latest feature improvements and bug fixes
            
            ### 更新内容
            - 版本 ${{ env.APP_VERSION }} 发布
            - 包含最新的功能改进和错误修复
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
